<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC 真实 IP 泄漏独立检测器 - Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --danger: #f43f5e;
      --success: #10b981;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      margin: 0;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { margin-top: 0; color: var(--primary); font-size: 1.75rem; }
    p { color: var(--text-muted); }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .badge-leak { background: rgba(244, 63, 94, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .badge-safe { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
    .ip-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.25rem;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      word-break: break-all;
      margin: 0.5rem 0;
    }
    pre {
      background: #090d16;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #38bdf8;
      max-height: 260px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚱 WebRTC 真实 IP 泄漏独立检测器</h1>
    <p>通过向 STUN 服务器发起打洞探测，检测您的浏览器是否在未经允许的情况下泄漏真实家庭公网 IP。</p>

    <div class="card">
      <button id="startBtn" onclick="runWebRtcTest()">🚀 开始探测 WebRTC 泄漏</button>
      <div id="resultArea" style="margin-top: 1.5rem; display: none;">
        <div id="statusBadge" class="status-badge">正在探测...</div>
        <div><strong>STUN 反射检测到的公网 IP (srflx)：</strong></div>
        <div id="ipDisplay" class="ip-box">探测中...</div>
        <p style="font-size: 0.9rem;">
          💡 判定提示：如果您使用了网页代理，但上方显示的依然是您本地电信/联通/移动的真实 IP，说明 WebRTC 发生了严重的隐私泄漏！
        </p>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">📡 实时 ICE Candidate 日志：</h3>
      <pre id="logOutput">// 点击“开始探测”后将在此输出底层 SDP 与 ICE Candidate 事件...</pre>
    </div>
  </div>

  <script>
    const CANDIDATE_IP_RE = /[0-9]{1,3}(?:\.[0-9]{1,3}){3}|[a-f0-9]{1,4}(?::[a-f0-9]{1,4}){7}/i;

    function log(msg) {
      const output = document.getElementById('logOutput');
      output.textContent += '\n' + msg;
      output.scrollTop = output.scrollHeight;
    }

    function runWebRtcTest() {
      const resultArea = document.getElementById('resultArea');
      const ipDisplay = document.getElementById('ipDisplay');
      const statusBadge = document.getElementById('statusBadge');
      const logOutput = document.getElementById('logOutput');

      resultArea.style.display = 'block';
      logOutput.textContent = '// 初始化 RTCPeerConnection 连接...';
      ipDisplay.textContent = '正在打洞探测...';
      statusBadge.className = 'status-badge';
      statusBadge.textContent = '探测中...';

      // 常见公共 STUN 服务器
      const stunServers = [
        'stun:stun.cloudflare.com:3478',
        'stun:stun.google.com:19302'
      ];

      try {
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: stunServers }]
        });

        pc.onicecandidate = (event) => {
          if (!event.candidate) {
            log('--> [ICE 完成] 所有候选地址收集完毕。');
            return;
          }

          const candidate = event.candidate.candidate;
          log(`--> 发现候选: ${candidate}`);

          // 核心过滤：只要 srflx（Server Reflexive）候选
          const parts = candidate.split(' ');
          const type = parts[7]; // candidate:xxx ... typ srflx

          if (type === 'srflx') {
            const match = CANDIDATE_IP_RE.exec(candidate);
            if (match) {
              const detectedIp = match[0];
              ipDisplay.textContent = detectedIp;
              statusBadge.className = 'status-badge badge-leak';
              statusBadge.textContent = '⚠️ 成功捕获真实反射 IP (srflx)';
              log(`\n🎉 [成功提取] WebRTC 反射 IP: ${detectedIp}`);
            }
          }
        };

        // 触发 ICE 协商
        pc.createDataChannel('leak-detector');
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .catch((err) => log('SDP 协商失败: ' + err.message));

        setTimeout(() => {
          if (ipDisplay.textContent === '正在打洞探测...') {
            ipDisplay.textContent = '未检测到公网反射 IP（您的浏览器可能已禁用 WebRTC 或屏蔽了 STUN）';
            statusBadge.className = 'status-badge badge-safe';
            statusBadge.textContent = '🛡️ 安全 / WebRTC 受保护';
          }
        }, 5000);

      } catch (err) {
        log('创建 RTCPeerConnection 失败: ' + err.message);
      }
    }
  </script>
</body>
</html>
