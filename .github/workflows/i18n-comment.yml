# Posts / updates one sticky translation-status comment on locale PRs.
#
# Deliberately split from CI: the report is computed there, under the
# read-only token fork PRs get, and handed over as an artifact. This
# workflow runs only trusted code from the default branch and holds the
# pull-requests: write token — never check out or execute anything from
# the PR here.
#
# The artifact is untrusted input (a PR can change scripts/i18n-status.js
# to emit whatever it likes), so no artifact byte ever reaches the comment.
# It carries structured claims — counts, locale codes, key paths — and each
# field is validated against a strict shape (enums, integer bounds, tight
# regexes) before trusted code here renders the comment text from scratch.
# A hostile PR can at most misstate its own coverage numbers; it cannot put
# a single word of prose, a link, or an instruction into the bot's mouth.
# (The numbers are advisory anyway — the merge gate is pnpm test.)
name: i18n PR comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # Only PR runs can carry the artifact; push runs are skipped outright.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download translation report
        id: download
        # No artifact = the PR didn't touch locale data; treat as a clean skip.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: i18n-report
          path: i18n-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upsert sticky comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.readFileSync(`i18n-report/${f}`, 'utf8').trim();

            const prNumber = Number.parseInt(read('pr-number'), 10);
            const headSha = read('head-sha');
            if (!Number.isInteger(prNumber) || prNumber <= 0) return;

            let data;
            try { data = JSON.parse(read('report.json')); } catch { return; }

            // The artifact came from an untrusted run: only write to the PR
            // whose head actually triggered that run.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber,
            });
            const runHead = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== runHead || headSha !== runHead) return;

            // Validate-then-render: every value below either matches a strict
            // shape or its row is dropped. Only validated numbers, enum labels
            // and regex-tight identifiers make it into the rendered text.
            const CODE = /^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})?$/;
            const KEY = /^[\w./-]{1,120}$/;
            const DATASET_LABELS = ['main pack', 'privacy copy', 'checklist'];
            const int = (v, max) => Number.isInteger(v) && v >= 0 && v <= max;
            const pct = (done, total) => ((done / (total || 1)) * 100).toFixed(1);
            const bar = (done, total) => {
              const filled = Math.min(24, Math.max(0, Math.round((done / (total || 1)) * 24)));
              return '█'.repeat(filled) + '░'.repeat(24 - filled);
            };

            const lines = [];
            const locales = Array.isArray(data?.locales) ? data.locales.slice(0, 50) : [];
            for (const loc of locales) {
              if (typeof loc?.code !== 'string' || !CODE.test(loc.code)) continue;
              if (!['full', 'beta'].includes(loc.status)) continue;
              const rows = (Array.isArray(loc.datasets) ? loc.datasets.slice(0, 10) : [])
                .filter((d) => DATASET_LABELS.includes(d?.name) && typeof d.file === 'boolean'
                  && int(d.done, 1e6) && int(d.total, 1e6) && d.done <= d.total);
              if (rows.length === 0) continue;
              const done = rows.reduce((sum, d) => sum + d.done, 0);
              const total = rows.reduce((sum, d) => sum + d.total, 0);
              lines.push(`${loc.code} [${loc.status}]  ${bar(done, total)} ${pct(done, total)}% (${done}/${total})`);
              for (const d of rows) {
                const note = d.file ? '' : '  (no file yet)';
                lines.push(`    ${d.name.padEnd(12)} ${pct(d.done, d.total).padStart(5)}%  ${d.done}/${d.total}${note}`);
              }
              if (int(loc.sameAsEn, 1e6) && loc.sameAsEn > 0) {
                lines.push(`    identical to en: ${loc.sameAsEn} value(s) — worth a spot check`);
              }
              const nextUp = (Array.isArray(loc.nextUp) ? loc.nextUp.slice(0, 10) : [])
                .filter((k) => typeof k === 'string' && KEY.test(k));
              if (nextUp.length > 0) lines.push(`    next up: ${nextUp.join(', ')}`);
              lines.push('');
            }
            if (lines.length === 0) return;

            const marker = '<!-- i18n-status-bot -->';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              marker,
              '### 🌍 Translation status',
              '',
              '```text',
              lines.join('\n').trimEnd(),
              '```',
              `Untranslated keys fall back to English — partial PRs are welcome, and every extra key helps. Guide: [TRANSLATING.md](${repoUrl}/blob/dev/TRANSLATING.md).`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body,
              });
            }
