# Posts / updates one sticky translation-status comment on locale PRs.
#
# Deliberately split from CI: the report is computed there, under the
# read-only token fork PRs get, and handed over as an artifact. This
# workflow runs only trusted code from the default branch and holds the
# pull-requests: write token — never check out or execute anything from
# the PR here.
#
# The artifact is untrusted input (a PR can change scripts/i18n-status.js
# to print whatever it likes). It is therefore treated as opaque text:
# backticks stripped, length capped, always rendered inside a code fence.
# Every piece of Markdown around it is authored here, by trusted code —
# nothing from the artifact can become a link, an image or formatting.
name: i18n PR comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # Only PR runs can carry the artifact; push runs are skipped outright.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download translation report
        id: download
        # No artifact = the PR didn't touch locale data; treat as a clean skip.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: i18n-report
          path: i18n-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upsert sticky comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.readFileSync(`i18n-report/${f}`, 'utf8').trim();

            const prNumber = Number.parseInt(read('pr-number'), 10);
            const headSha = read('head-sha');
            // Neutralize the untrusted report: no backticks (so it can never
            // escape the fence below), bounded size (comment cap is 65536).
            const report = read('report.txt').replace(/`/g, '').slice(0, 55000);
            if (!Number.isInteger(prNumber) || prNumber <= 0) return;

            // The artifact came from an untrusted run: only write to the PR
            // whose head actually triggered that run.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber,
            });
            const runHead = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== runHead || headSha !== runHead) return;

            const marker = '<!-- i18n-status-bot -->';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              marker,
              '### 🌍 Translation status',
              '',
              '```text',
              report,
              '```',
              `Untranslated keys fall back to English — partial PRs are welcome, and every extra key helps. Guide: [TRANSLATING.md](${repoUrl}/blob/dev/TRANSLATING.md).`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body,
              });
            }
