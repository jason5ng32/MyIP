name: Docker Build and Push

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true

# Least-privilege GITHUB_TOKEN:
# - contents: read  → checkout the source
# - packages: write → push the built image to ghcr.io/${owner}/myip
# Docker Hub push uses DOCKER_HUB_ACCESS_TOKEN (a repo secret), not GITHUB_TOKEN,
# so no extra scopes are needed for that half of the job.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    # The multi-arch build normally lands in ~5 min; a hosted runner that loses
    # its connection would otherwise sit "in progress" for the 6h default.
    timeout-minutes: 20

    steps:
    - name: Check Out Repo
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Login to GitHub Packages
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get the version
      if: github.event_name == 'release'
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: echo "RELEASE_VERSION=$TAG_NAME" >> "$GITHUB_ENV"

    - name: Set version for manual dispatch
      if: github.event_name == 'workflow_dispatch'
      env:
        DISPATCH_VERSION: ${{ github.event.inputs.version }}
      run: echo "RELEASE_VERSION=$DISPATCH_VERSION" >> "$GITHUB_ENV"

    # OCI labels (title / description / source / revision / …) from the repo;
    # tags stay hand-written below. A manual dispatch runs on `main`, so the
    # version label is pinned to RELEASE_VERSION.
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        labels: |
          org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: |
          jason5ng32/myip:latest
          jason5ng32/myip:${{ env.RELEASE_VERSION }}
          ghcr.io/${{ github.repository_owner }}/myip:latest
          ghcr.io/${{ github.repository_owner }}/myip:${{ env.RELEASE_VERSION }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
