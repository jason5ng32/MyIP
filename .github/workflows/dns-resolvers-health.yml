# Run a scheduled external check so stale or restricted public resolvers are
# noticed before a contributor is sent after an unusable endpoint.
name: DNS Resolver Health

on:
  push:
    branches: [dev]
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check public UDP resolvers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dig
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dnsutils

      - name: Probe resolvers
        id: probe
        shell: bash
        run: |
          set +e
          node scripts/check-dns-resolvers.js --json > dns-resolver-health.json
          status=$?
          jq -r '.markdown' dns-resolver-health.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Probe exit status: $status"
          exit "$status"

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-resolver-health-${{ github.run_id }}
          path: dns-resolver-health.json
          if-no-files-found: error
          retention-days: 14
