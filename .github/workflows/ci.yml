name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least-privilege GITHUB_TOKEN: tests + build only need to read the repo.
permissions:
  contents: read

jobs:
  check:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # Reads the `packageManager` field in package.json to pin the pnpm version,
        # so CI uses the exact same pnpm as local dev.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # The committed pnpm-lock.yaml lets setup-node cache the pnpm store keyed
          # off the lockfile hash — installs are warm on every run after the first.
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile: install strictly from the lockfile and fail if it is
        # out of sync with package.json, rather than silently rewriting it.
        run: pnpm install --frozen-lockfile

      - name: Translation status
        # Locale progress dashboard into the run summary, so a translation PR's
        # author and reviewer see coverage and the next keys to translate without
        # a local run. Report only — the script always exits 0; the mechanical
        # gate for locale packs lives in pnpm test below.
        run: |
          {
            echo '```text'
            node scripts/i18n-status.js
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare translation report artifact
        # Locale-touching PRs get a sticky status comment, posted by
        # i18n-comment.yml (this job's token is read-only, and fork PRs never
        # see secrets — so the report is computed here and handed over as an
        # artifact). No locale changes → no artifact → no comment.
        #
        # The artifact carries RAW TEXT only. This run executes the PR's own
        # code, so nothing produced here may reach a comment as Markdown —
        # the privileged side sanitizes the text and owns all formatting.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[].filename' \
            | grep -qE '^(frontend/locales/|common/locale-registry\.js|frontend/data/changelog\.json)'; then
            exit 0
          fi
          mkdir -p i18n-report
          node scripts/i18n-status.js > i18n-report/report.txt
          printf '%s\n' "$PR_NUMBER" > i18n-report/pr-number
          printf '%s\n' "$HEAD_SHA" > i18n-report/head-sha

      - name: Upload translation report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: i18n-report
          path: i18n-report/
          if-no-files-found: ignore

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build
